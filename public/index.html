<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer Control</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #2979ff;
            --text: #fff;
            --text-dim: #b3b3b3;
        }

        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            height: 100%;
        }

        /* Экраны */
        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            background: var(--bg);
            padding: 15px;
            box-sizing: border-box;
        }

        .view-hidden-right {
            transform: translateX(100%);
        }

        .view-hidden-left {
            transform: translateX(-100%);
        }

        /* Верхняя панель (Списки) */
        .header {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .status {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .online {
            color: #00e676;
        }

        .offline {
            color: #ff5252;
        }

        .btn-power {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Браузер папок */
        .browser {
            background: var(--card);
            border-radius: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .browser-header {
            background: #2c2c2c;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #555;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-back:disabled {
            opacity: 0.3;
        }

        .list {
            flex-grow: 1;
            overflow-y: auto;
        }

        .item {
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .item:hover {
            background: #2a2a2a;
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-artist {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* --- ЭКРАН ПЛЕЕРА --- */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .cover-container {
            width: 100%;
            aspect-ratio: 1;
            background: #2a2a2a;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .track-title {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 16px;
            color: var(--text-dim);
            margin: 0;
        }

        /* Прогресс бар */
        .progress-container {
            margin-bottom: 30px;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 0 20px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            font-size: 35px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .ctrl-btn:active {
            transform: scale(0.9);
            opacity: 0.7;
        }

        .ctrl-play {
            font-size: 50px;
            color: var(--text);
        }
    </style>
</head>

<body>

    <div class="app-container">

        <div id="view-library" class="view">
            <div class="header">
                <div class="status">Pioneer: <span id="pioneer-status" class="offline">Ожидание...</span></div>
                <button class="btn-power" onclick="sendCmd('power_toggle')">ВКЛ / ВЫКЛ</button>
            </div>
            <div class="browser">
                <div class="browser-header">
                    <button class="btn-back" id="btn-back" onclick="goBack()" disabled>❮ Назад</button>
                    <span id="current-path"
                        style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Корень</span>
                </div>
                <div class="list" id="dlna-list"></div>
            </div>

            <div id="mini-player"
                style="display: none; background: #2c2c2c; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: center; cursor: pointer;"
                onclick="showPlayerView()">
                <span style="color: var(--accent);">🎵 Сейчас играет</span><br>
                <span id="mini-title" style="font-weight: bold;"></span>
            </div>
        </div>

        <div id="view-player" class="view view-hidden-right">
            <div class="player-header">
                <button class="btn-icon" style="font-size: 28px;" onclick="showLibraryView()">▼</button>
                <span style="font-size: 14px; color: var(--text-dim); font-weight: bold;">NOW PLAYING</span>
                <div style="width: 28px;"></div>
            </div>

            <div class="cover-container">
                <img id="player-cover" class="cover-img" src="" style="display: none;">
                <div id="player-no-cover" style="font-size: 60px; color: #555;">🎵</div>
            </div>

            <div class="track-info">
                <h2 id="player-title" class="track-title">Название трека</h2>
                <p id="player-artist" class="track-artist">Артист • Альбом</p>
            </div>

            <div class="progress-container">
                <div class="time-labels">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
                <input type="range" id="seek-bar" value="0" min="0" max="100" onchange="seekTrack(this.value)"
                    oninput="pauseTimeUpdate()">
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="playPrev()">⏮</button>
                <button class="ctrl-btn ctrl-play" id="btn-play-pause" onclick="togglePlayPause()">⏸</button>
                <button class="ctrl-btn" onclick="playNext()">⏭</button>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // --- НАВИГАЦИЯ ЭКРАНОВ ---
        function showPlayerView() {
            document.getElementById('view-library').classList.add('view-hidden-left');
            document.getElementById('view-player').classList.remove('view-hidden-right');
        }
        function showLibraryView() {
            document.getElementById('view-player').classList.add('view-hidden-right');
            document.getElementById('view-library').classList.remove('view-hidden-left');
        }

        // --- БАЗОВЫЕ КОМАНДЫ ---
        function sendCmd(action) { socket.emit('ui-command', action); }

        socket.on('pioneer-status', (status) => {
            const el = document.getElementById('pioneer-status');
            if (!status.connected) { el.className = 'offline'; el.innerText = 'Нет связи (TCP)'; }
        });
        socket.on('state-change', (data) => {
            if (data.device === 'power') {
                const el = document.getElementById('pioneer-status');
                el.className = data.value === 'ON' ? 'online' : 'offline';
                el.innerText = data.value === 'ON' ? 'Включен' : 'Standby';
            }
        });

        // --- ОБРАБОТКА ПОТЕРИ УПРАВЛЕНИЯ ---
        socket.on('access-denied', (message) => {
            // Убиваем весь интерфейс и показываем заглушку
            document.body.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #121212; color: white; text-align: center; padding: 20px; font-family: -apple-system, sans-serif; box-sizing: border-box;">
                <div style="font-size: 60px; margin-bottom: 20px;">🚫</div>
                <h2 style="color: #ff5252; margin: 0 0 10px 0;">Отключено</h2>
                <p style="color: #b3b3b3; margin-bottom: 40px; font-size: 16px;">${message}</p>
                <button onclick="location.reload()" style="background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(41, 121, 255, 0.4);">
                    Перехватить обратно
                </button>
            </div>
        `;
        });

        // --- DLNA НАВИГАЦИЯ ---
        let historyStack = [];
        let currentFolderId = '0';
        let currentFolderName = 'Корневой каталог';
        let activePlaylist = [], activeTrackIndex = -1;

        function loadFolder(id, name) {
            if (id !== currentFolderId) historyStack.push({ id: currentFolderId, name: currentFolderName });
            currentFolderId = id; currentFolderName = name;
            document.getElementById('current-path').innerText = name;
            document.getElementById('btn-back').disabled = historyStack.length === 0;
            document.getElementById('dlna-list').innerHTML = '<div style="padding: 20px; text-align: center; color: #777;">Загрузка...</div>';
            socket.emit('dlna-browse', id);
        }

        function goBack() {
            if (historyStack.length > 0) {
                const prev = historyStack.pop();
                currentFolderId = prev.id; currentFolderName = prev.name;
                document.getElementById('current-path').innerText = prev.name;
                document.getElementById('btn-back').disabled = historyStack.length === 0;
                document.getElementById('dlna-list').innerHTML = '<div style="padding: 20px; text-align: center; color: #777;">Загрузка...</div>';
                socket.emit('dlna-browse', prev.id);
            }
        }

        let currentViewTracks = [];
        socket.on('dlna-data', (data) => {
            const list = document.getElementById('dlna-list');
            list.innerHTML = '';
            currentViewTracks = data.tracks;

            data.folders.forEach(folder => {
                const div = document.createElement('div'); div.className = 'item';
                div.innerHTML = `<span style="font-size: 24px;">📁</span> <span>${folder.title}</span>`;
                div.onclick = () => loadFolder(folder.id, folder.title);
                list.appendChild(div);
            });

            data.tracks.forEach((track, index) => {
                const div = document.createElement('div'); div.className = 'item';
                div.innerHTML = `
                <span style="font-size: 24px; color: var(--accent);">🎵</span> 
                <div class="item-info">
                    <span>${track.title}</span>
                    <span class="item-artist">${track.artist}</span>
                </div>`;
                div.onclick = () => playTrack(index);
                list.appendChild(div);
            });
        });

        // --- ЛОГИКА ПЛЕЕРА ---
        let timeInterval = null;
        let isUserSeeking = false;

        function playTrack(index) {
            activePlaylist = [...currentViewTracks];
            activeTrackIndex = index;
            const track = activePlaylist[activeTrackIndex];

            // Обновляем UI плеера
            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = `${track.artist} • ${track.album}`;
            document.getElementById('mini-player').style.display = 'block';
            document.getElementById('mini-title').innerText = track.title;

            if (track.cover) {
                document.getElementById('player-cover').src = track.cover;
                document.getElementById('player-cover').style.display = 'block';
                document.getElementById('player-no-cover').style.display = 'none';
            } else {
                document.getElementById('player-cover').style.display = 'none';
                document.getElementById('player-no-cover').style.display = 'block';
            }

            socket.emit('play-track', track);
            showPlayerView();

            // Запускаем опрос времени раз в секунду
            if (timeInterval) clearInterval(timeInterval);
            timeInterval = setInterval(() => socket.emit('request-time'), 1000);
        }

        function playNext() { if (activeTrackIndex < activePlaylist.length - 1) playTrack(activeTrackIndex + 1); }
        function playPrev() { if (activeTrackIndex > 0) playTrack(activeTrackIndex - 1); else playTrack(0); }

        // --- ПОЛЗУНОК ВРЕМЕНИ ---
        function timeToSeconds(timeStr) {
            if (!timeStr || timeStr === 'NOT_IMPLEMENTED') return 0;
            const parts = timeStr.split(':');
            return (+parts[0]) * 3600 + (+parts[1]) * 60 + (+parts[2]);
        }

        function secondsToTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}` : `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Приостанавливаем обновление ползунка с сервера, пока юзер его тянет
        function pauseTimeUpdate() { isUserSeeking = true; }

        function seekTrack(seconds) {
            isUserSeeking = false;
            // Строгий формат HH:MM:SS
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');

            const targetTime = `${h}:${m}:${s}`;
            socket.emit('seek', targetTime);
        }

        socket.on('time-update', (data) => {
            if (isUserSeeking) return; // Не дергаем ползунок, если юзер его держит

            const curSec = timeToSeconds(data.current);
            const totSec = timeToSeconds(data.total);

            document.getElementById('time-current').innerText = secondsToTime(curSec);
            document.getElementById('time-total').innerText = secondsToTime(totSec);

            const seekBar = document.getElementById('seek-bar');
            seekBar.max = totSec;
            seekBar.value = curSec;
        });

        // --- ЛОГИКА ЕДИНОЙ КНОПКИ PLAY / PAUSE ---
        let isPlaying = false;
        let savedPauseTime = 0;

        function togglePlayPause() {
            const btn = document.getElementById('btn-play-pause');

            if (isPlaying) {
                // ДЕЙСТВИЕ: СТАВИМ НА ПАУЗУ
                savedPauseTime = document.getElementById('seek-bar').value; // Запоминаем секунды
                sendCmd('stop'); // Физически останавливаем Pioneer (никаких ошибок 500)
                isPlaying = false;
                btn.innerHTML = '▶'; // Меняем иконку
                console.log(`Программная пауза на ${savedPauseTime} сек.`);
            } else {
                // ДЕЙСТВИЕ: СНИМАЕМ С ПАУЗЫ
                isPlaying = true;
                btn.innerHTML = '⏸';

                const track = activePlaylist[activeTrackIndex];

                // Конвертируем секунды в формат Пионера (0:01:23)
                const h = Math.floor(savedPauseTime / 3600).toString();
                const m = Math.floor((savedPauseTime % 3600) / 60).toString().padStart(2, '0');
                const s = Math.floor(savedPauseTime % 60).toString().padStart(2, '0');
                const targetTime = `${h}:${m}:${s}`;

                // Отправляем бэкенду команду "возобновить"
                socket.emit('resume-track', { track: track, time: targetTime });
            }
        }

        // Нужно обновить функцию playTrack, чтобы она сбрасывала состояние при включении новой песни
        const originalPlayTrack = playTrack; // Сохраняем старую логику
        playTrack = function (index) {
            isPlaying = true;
            savedPauseTime = 0;
            document.getElementById('btn-play-pause').innerHTML = '⏸';
            originalPlayTrack(index); // Вызываем оригинальную логику
        };

        window.onload = () => socket.emit('dlna-browse', '0');
        // --- РЕГИСТРАЦИЯ SERVICE WORKER (ДЛЯ PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('Service Worker зарегистрирован!', reg.scope))
                    .catch((err) => console.error('Ошибка регистрации Service Worker:', err));
            });
        }
    </script>
</body>

</html>
